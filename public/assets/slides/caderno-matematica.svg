<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Pagina quadriculada com o esboco da parabola y igual a x ao quadrado">
  <defs>
    <linearGradient id="mesaM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#292520"/>
      <stop offset="1" stop-color="#15120E"/>
    </linearGradient>
    <linearGradient id="papelM" x1="0.05" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#FBF8F0"/>
      <stop offset="0.5" stop-color="#F2EEE2"/>
      <stop offset="1" stop-color="#E1D9C7"/>
    </linearGradient>
    <pattern id="quadriculado" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0 H0 V42" fill="none" stroke="#C2D2E0" stroke-width="1.6"/>
    </pattern>
    <filter id="sombraM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="luzM" cx="0.62" cy="0.15" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#mesaM)"/>

  <g transform="rotate(1.8 600 450)" filter="url(#sombraM)">
    <rect x="90" y="60" width="1020" height="780" rx="8" fill="url(#papelM)"/>
    <rect x="90" y="60" width="1020" height="780" fill="url(#quadriculado)" opacity="0.85"/>

    <g fill="#23324A" font-family="Georgia, 'Times New Roman', serif">
      <text x="150" y="150" font-size="38" font-style="italic">Área entre y = x² e y = 4</text>
    </g>

    <!-- plano cartesiano -->
    <g transform="translate(190 250)">
      <!-- regiao delimitada -->
      <path d="M60 300 Q180 -120 300 300 Z" fill="#2E6E5B" opacity="0.18"/>
      <line x1="0" y1="300" x2="360" y2="300" stroke="#23324A" stroke-width="3"/>
      <line x1="180" y1="380" x2="180" y2="-30" stroke="#23324A" stroke-width="3"/>
      <path d="M180 -30 l-9 20 M180 -30 l9 20" stroke="#23324A" stroke-width="3" fill="none"/>
      <path d="M360 300 l-20 -9 M360 300 l-20 9" stroke="#23324A" stroke-width="3" fill="none"/>
      <!-- parabola -->
      <path d="M60 300 Q180 -120 300 300" fill="none" stroke="#1F5E4C" stroke-width="4"/>
      <!-- reta y = 4 -->
      <line x1="30" y1="90" x2="340" y2="90" stroke="#B05A3C" stroke-width="4"/>
      <g fill="#23324A" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
        <text x="308" y="78" font-size="26">y = 4</text>
        <text x="296" y="200" font-size="26">y = x²</text>
        <text x="190" y="340" font-size="24" opacity="0.75">−2</text>
        <text x="120" y="340" font-size="24" opacity="0.75">0</text>
      </g>
    </g>

    <g fill="#23324A" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
      <text x="640" y="300" font-size="32">interseções:</text>
      <text x="640" y="358" font-size="32">x² = 4  →  x = ±2</text>

      <text x="640" y="470" font-size="34">A = ∫ (4 − x²) dx</text>
      <text x="640" y="524" font-size="22" opacity="0.75">de −2 até 2</text>

      <text x="640" y="620" font-size="34">A = [ 4x − x³/3 ]</text>
      <text x="640" y="686" font-size="34">A = ________</text>
    </g>
  </g>

  <rect width="1200" height="900" fill="url(#luzM)"/>
</svg>
