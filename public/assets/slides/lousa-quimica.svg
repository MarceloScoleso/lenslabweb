<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Lousa com o balanceamento de uma reacao de neutralizacao">
  <defs>
    <linearGradient id="parede" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26221D"/>
      <stop offset="1" stop-color="#17140F"/>
    </linearGradient>
    <linearGradient id="quadro" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#243B33"/>
      <stop offset="0.5" stop-color="#1C302A"/>
      <stop offset="1" stop-color="#16261F"/>
    </linearGradient>
    <linearGradient id="moldura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6A45"/>
      <stop offset="1" stop-color="#5B452C"/>
    </linearGradient>
    <radialGradient id="giz" cx="0.3" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinheta" cx="0.5" cy="0.45" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#parede)"/>

  <g transform="rotate(-1.1 600 450)">
    <rect x="52" y="52" width="1096" height="796" rx="10" fill="url(#moldura)"/>
    <rect x="72" y="72" width="1056" height="756" rx="4" fill="url(#quadro)"/>
    <rect x="72" y="72" width="1056" height="756" rx="4" fill="url(#giz)"/>

    <!-- marcas de giz apagado -->
    <g fill="#FFFFFF" opacity="0.045">
      <ellipse cx="330" cy="250" rx="230" ry="70"/>
      <ellipse cx="860" cy="640" rx="200" ry="55"/>
      <ellipse cx="620" cy="430" rx="300" ry="40"/>
    </g>

    <g fill="#EDF4EE" font-family="Georgia, 'Times New Roman', serif">
      <text x="140" y="200" font-size="46" letter-spacing="1">Reações de neutralização</text>
      <line x1="140" y1="222" x2="700" y2="226" stroke="#EDF4EE" stroke-width="3" opacity="0.55"/>

      <text x="140" y="330" font-size="56" letter-spacing="2">HCℓ + NaOH → NaCℓ + H₂O</text>

      <text x="140" y="410" font-size="34" opacity="0.85">ácido + base → sal + água</text>

      <!-- tabela reagentes / produtos -->
      <text x="140" y="520" font-size="32" opacity="0.9">reagentes</text>
      <text x="620" y="520" font-size="32" opacity="0.9">produtos</text>

      <text x="140" y="586" font-size="30" opacity="0.78">HCℓ .... 1 mol</text>
      <text x="620" y="586" font-size="30" opacity="0.78">NaCℓ ... 1 mol</text>

      <text x="140" y="644" font-size="30" opacity="0.78">NaOH ... 1 mol</text>
      <text x="620" y="644" font-size="30" opacity="0.78">H₂O .... 1 mol</text>

      <text x="140" y="740" font-size="28" opacity="0.7">equação já balanceada ✓</text>
    </g>

    <g stroke="#EDF4EE" stroke-width="2.5" opacity="0.5">
      <line x1="140" y1="546" x2="1040" y2="546"/>
      <line x1="590" y1="490" x2="590" y2="670"/>
    </g>

    <!-- apagador na calha -->
    <rect x="72" y="828" width="1056" height="20" rx="4" fill="url(#moldura)"/>
    <rect x="880" y="806" width="120" height="26" rx="6" fill="#D8CFC0"/>
    <rect x="880" y="806" width="120" height="11" rx="5" fill="#8C7F6C"/>
  </g>

  <rect width="1200" height="900" fill="url(#vinheta)"/>
</svg>
